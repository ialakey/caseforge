name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # prisma generate runs on postinstall and only needs a parseable URL
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public

      - name: Build shared
        run: pnpm --filter @caseforge/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test
