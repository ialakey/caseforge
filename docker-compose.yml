services:
  postgres:
    image: postgres:16-alpine
    container_name: csgo_case_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: csgo
      POSTGRES_PASSWORD: csgo
      POSTGRES_DB: csgo_case
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csgo -d csgo_case"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: csgo_case_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
